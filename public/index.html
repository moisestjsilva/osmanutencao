<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nova OS — Ordens de Serviço de Manutenção Industrial</title>
  <meta name="description" content="Abra e atenda ordens de serviço industriais pelo celular: identificação de máquinas por QR, máquinas paradas em destaque, preventivas, indicadores e registro mesmo com quedas de internet." />
  <meta name="theme-color" content="#0d111a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    (function() {
      const saved = localStorage.getItem('nova-os:theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <div id="offline-banner" class="offline-banner hidden" role="status">Sem conexão — registros ficam salvos no aparelho e serão enviados ao reconectar</div>
  <header class="app-header">
    <a class="brand" href="#/" id="brand-link" aria-label="Nova OS — início">
      <span class="brand-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      </span>
      <span>Nova OS<small>Manutenção</small></span>
    </a>
    <div class="header-actions">
      <button class="sync-pill" id="sync-pill" aria-label="Status de sincronização"><span class="dot"></span><span id="sync-label">Online</span></button>
      <button class="icon-btn" id="btn-install" aria-label="Instalar aplicativo" title="Instalar no celular ou computador">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" aria-label="Alternar tema claro/escuro" title="Alternar tema"></button>
      <button class="icon-btn" id="btn-notifs" aria-label="Avisos">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge-count hidden" id="notif-count">0</span>
      </button>
      <button class="user-chip" id="btn-user" aria-label="Meu Perfil"><span class="avatar" id="user-avatar">?</span></button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <button class="nav-item" data-nav="#/" id="nav-os">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
      Ordens
    </button>
    <button class="nav-item" data-nav="#/preventivas" id="nav-prev">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
      Preventivas
    </button>
    <button class="nav-fab" data-nav="#/nova" id="nav-new" aria-label="Abrir nova OS">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="nav-item" data-nav="#/indicadores" id="nav-kpi">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Indicadores
    </button>
    <button class="nav-item" data-nav="#/mais" id="nav-more">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      Mais
    </button>
  </nav>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js?v=2"></script>
</body>
</html>
